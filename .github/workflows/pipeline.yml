name: pipeline

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Allowlisted task card path (evaluation-demo/task.md or fixtures/tasks/*.json)'
        required: true
        default: 'evaluation-demo/task.md'
      mode:
        description: 'Pipeline mode'
        required: true
        default: 'acceptance'
        type: choice
        options:
          - acceptance
          - baseline
          - full

permissions:
  contents: read

jobs:
  isolated-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIPELINE_MODE: ${{ inputs.mode }}
      PIPELINE_ARTIFACTS_DIR: artifacts
      PIPELINE_WORKSPACE_DIR: workspace
      # Default deny egress; public-catalog scenario enables loopback itself.
      PIPELINE_ALLOW_NETWORK: 'false'
      PIPELINE_AGENT_MODE: mock
      PIPELINE_LOG_LEVEL: info
      # Pass task via env (not shell interpolation) to avoid injection.
      TASK_PATH: ${{ inputs.task }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate task path allowlist
        run: |
          set -euo pipefail
          TASK="${TASK_PATH}"
          if [[ "${TASK}" == "evaluation-demo/task.md" ]]; then
            exit 0
          fi
          if [[ "${TASK}" =~ ^fixtures/tasks/[A-Za-z0-9._-]+\.json$ ]]; then
            exit 0
          fi
          echo "Disallowed task path (Phase 1 allowlist only): ${TASK}" >&2
          exit 1

      - name: Run task (public catalog for task.md; JSON otherwise)
        id: run
        run: |
          set -euo pipefail
          mkdir -p artifacts workspace
          TASK="${TASK_PATH}"
          if [[ "${TASK}" == "evaluation-demo/task.md" ]]; then
            node --import tsx -e "
              import { runPublicCatalogScenario } from './src/scenarios/public-catalog/run-scenario.ts';
              import { mkdirSync } from 'node:fs';
              mkdirSync('artifacts', { recursive: true });
              mkdirSync('workspace', { recursive: true });
              const r = await runPublicCatalogScenario({
                rootDir: process.cwd(),
                runId: 'gha-' + Date.now(),
                keepWorkspace: false,
                useRealBrowser: process.env.PIPELINE_USE_REAL_BROWSER === '1',
              });
              console.log(JSON.stringify({ status: r.result.status, exitCode: r.result.exitCode, artifactDir: r.result.artifactDir }, null, 2));
              process.exit(r.result.exitCode);
            "
          else
            npm run pipeline -- run --task "${TASK}"
          fi

      - name: Independent validator (artifact-only)
        run: |
          set -euo pipefail
          RUN_DIR="$(ls -1dt artifacts/* 2>/dev/null | head -1)"
          if [[ -z "${RUN_DIR}" ]]; then
            echo "No artifacts/<run_id> directory found" >&2
            exit 1
          fi
          echo "Validating ${RUN_DIR}"
          node packages/validator/bin/validate.mjs --run-dir "${RUN_DIR}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
